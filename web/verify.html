<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Extraction Verify</title>
<style>
  :root { --bg:#0d0f12; --card:#16191e; --line:#262b33; --fg:#dfe3e8; --dim:#8a909a;
          --good:#4caf78; --bad:#d4736b; --gold:#c9a14a; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
  header { position:sticky; top:0; z-index:5; background:rgba(13,15,18,0.96);
           border-bottom:1px solid var(--line); padding:12px 20px; display:flex;
           align-items:center; gap:18px; backdrop-filter:blur(6px); }
  header h1 { font-size:15px; margin:0; font-weight:600; }
  .tally { font-variant-numeric:tabular-nums; color:var(--dim); }
  .tally b.ok { color:var(--good); } .tally b.bad { color:var(--bad); }
  .filterbtn { background:var(--card); color:var(--dim); border:1px solid var(--line);
               border-radius:6px; padding:4px 10px; cursor:pointer; font-size:12px; }
  .filterbtn.on { color:var(--fg); border-color:var(--gold); }
  main { max-width:1100px; margin:0 auto; padding:20px; display:flex;
         flex-direction:column; gap:16px; }
  .row { display:grid; grid-template-columns:minmax(0,1fr) 360px; gap:18px;
         background:var(--card); border:1px solid var(--line); border-radius:10px;
         padding:14px; }
  .row.ok { border-color:rgba(76,175,120,0.5); }
  .row.wrong { border-color:rgba(212,115,107,0.5); }
  .chartwrap { display:flex; align-items:center; justify-content:center;
               background:#000; border-radius:6px; overflow:hidden; min-height:260px; }
  .chartwrap img { max-width:100%; max-height:520px; cursor:zoom-in; }
  .meta { display:flex; flex-direction:column; gap:8px; }
  .idx { color:var(--dim); font-size:12px; }
  .badge { display:inline-block; padding:2px 8px; border-radius:5px; font-size:12px;
           font-weight:600; }
  .ct-directional_long  { background:rgba(76,175,120,0.15); color:var(--good); }
  .ct-directional_short { background:rgba(212,115,107,0.15); color:var(--bad); }
  .ct-bidirectional     { background:rgba(201,161,74,0.15); color:var(--gold); }
  .ct-retrospective     { background:rgba(120,140,200,0.18); color:#9fb0e0; }
  .ct-no_trade          { background:rgba(255,255,255,0.06); color:var(--dim); }
  .ct-not_a_chart       { background:rgba(120,120,120,0.12); color:#777; }
  .kv { font-size:13px; } .kv span { color:var(--dim); }
  .kv b { color:var(--fg); font-weight:600; }
  .setups { font-size:12px; color:var(--dim); white-space:pre-wrap;
            background:rgba(255,255,255,0.03); padding:6px 8px; border-radius:5px;
            max-height:160px; overflow:auto; }
  .caption { font-size:12px; color:#b9c2cf; white-space:pre-wrap; font-style:italic;
             background:rgba(120,140,200,0.08); border-left:2px solid #6f7fb0;
             padding:6px 8px; border-radius:4px; max-height:120px; overflow:auto; }
  .caption.empty { color:var(--dim); font-style:normal; border-left-color:var(--line); }
  .actions { display:flex; gap:8px; margin-top:6px; }
  .actions button { flex:1; padding:8px; border-radius:6px; border:1px solid var(--line);
                    background:var(--card); color:var(--fg); cursor:pointer; font-weight:600; }
  .actions button.ok { border-color:var(--good); } .actions button.ok.sel { background:rgba(76,175,120,0.2); }
  .actions button.bad { border-color:var(--bad); } .actions button.bad.sel { background:rgba(212,115,107,0.2); }
  .notes { width:100%; background:#0d0f12; border:1px solid var(--line); color:var(--fg);
           border-radius:6px; padding:6px; font-size:12px; resize:vertical; }
  .correct { margin-top:8px; border-top:1px dashed var(--line); padding-top:8px;
             display:flex; flex-direction:column; gap:6px; }
  .correct .lbl { font-size:9px; letter-spacing:0.1em; text-transform:uppercase;
                  color:var(--dim); }
  .correct .grid { display:grid; grid-template-columns:1fr 1fr; gap:6px; }
  .correct label { font-size:11px; color:var(--dim); display:flex; flex-direction:column; gap:2px; }
  .correct select, .correct input { background:#0d0f12; border:1px solid var(--line);
           color:var(--fg); border-radius:5px; padding:5px; font-size:12px; }
  .correct input.changed, .correct select.changed { border-color:var(--gold); color:var(--gold); }
  .savebtn { background:rgba(201,161,74,0.15); color:var(--gold); border:1px solid var(--gold);
             border-radius:6px; padding:7px; cursor:pointer; font-weight:600; font-size:12px; }
  .savebtn.done { background:rgba(76,175,120,0.15); color:var(--good); border-color:var(--good); }
  .err { color:var(--bad); font-size:12px; }
  .lightbox { position:fixed; inset:0; background:rgba(0,0,0,0.92); display:none;
              align-items:center; justify-content:center; z-index:50; cursor:zoom-out; }
  .lightbox img { max-width:96vw; max-height:96vh; }
  .lightbox.on { display:flex; }
  .empty { color:var(--dim); text-align:center; padding:60px; }
</style>
</head>
<body>
<header>
  <h1>Extraction Verify</h1>
  <span class="tally" id="tally">loading…</span>
  <span style="margin-left:auto"></span>
  <button class="filterbtn on" data-f="all">all</button>
  <button class="filterbtn" data-f="unmarked">unmarked</button>
  <button class="filterbtn" data-f="ok">✓ ok</button>
  <button class="filterbtn" data-f="wrong">✗ wrong</button>
  <button class="filterbtn" data-f="refresh" title="reload results">↻ refresh</button>
  <span style="margin-left:14px; display:flex; align-items:center; gap:6px;">
    <button class="filterbtn" id="prev">‹ prev</button>
    <span class="tally" id="pager">page 1</span>
    <button class="filterbtn" id="next">next ›</button>
  </span>
</header>
<main id="list"><div class="empty">Loading extractions…</div></main>
<div class="lightbox" id="lb" onclick="this.classList.remove('on')"><img id="lbimg"/></div>

<script>
let DATA = { results: [], verdicts: {} };
let FILTER = "all";
let PAGE = 0;
const PAGE_SIZE = 50;
// API base: same-origin when served from the API server (:8000); otherwise
// (IDE preview panel / static server) hit :8000 directly. CORS is enabled.
const API = (location.port === "8000" || location.protocol === "file:")
  ? (location.protocol === "file:" ? "http://localhost:8000" : "")
  : `http://${location.hostname || "localhost"}:8000`;
const CT_OPTS = ["directional_long","directional_short","bidirectional","retrospective","no_trade","not_a_chart"];
const DIR_OPTS = ["","long","short"];
const BIAS_OPTS = ["","bullish","bearish","neutral"];   // = CURRENT sentiment, not original thesis
const STAGE_OPTS = ["","watching","active","completed"];

async function load() {
  try {
    const r = await fetch(API + "/api/manual/verify/list");
    if (!r.ok) throw new Error("HTTP " + r.status);
    DATA = await r.json();
    render();
  } catch (e) {
    document.getElementById("list").innerHTML =
      `<div class="empty">⚠ Could not reach the API at <code>${API||location.origin}</code><br>` +
      `${e.message}<br><br>Open this page directly at ` +
      `<a href="http://localhost:8000/web/verify.html" style="color:#c9a14a">` +
      `http://localhost:8000/web/verify.html</a></div>`;
  }
}
function readCorrection(card) {
  if (!card) return {};
  const g = (sel) => { const el = card.querySelector(sel); return el ? el.value.trim() : ""; };
  const c = {
    call_type: g(".c-call_type"),
    direction: g(".c-direction"),
    ticker: g(".c-ticker"),
    is_forward_looking: g(".c-fwd") === "true",
    final_target: g(".c-target"),
    bias: g(".c-bias"),
    trade_stage: g(".c-stage"),
  };
  return c;
}
async function post(path, verdict, correction, notes) {
  const r = await fetch(API + "/api/manual/verify/mark", {
    method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({ path, verdict, notes, correction })
  });
  await r.json();
  DATA.verdicts[path] = { verdict, notes, correction };
  render();
}
async function mark(path, verdict) {
  const card = document.querySelector(`[data-path="${CSS.escape(path)}"]`);
  const notes = card ? card.querySelector(".notes").value : "";
  await post(path, verdict, readCorrection(card), notes);
}
async function saveCorrection(path) {
  // Saving the ground-truth form implies "wrong" unless already marked ok.
  const card = document.querySelector(`[data-path="${CSS.escape(path)}"]`);
  const notes = card ? card.querySelector(".notes").value : "";
  const prev = DATA.verdicts[path]?.verdict;
  await post(path, prev || "wrong", readCorrection(card), notes);
}
function lightbox(src){ const lb=document.getElementById("lb");
  document.getElementById("lbimg").src=src; lb.classList.add("on"); }

function render() {
  const tally = document.getElementById("tally");
  const n = DATA.results.length;
  const v = DATA.verdicts || {};
  const ok = Object.values(v).filter(x=>x.verdict==="ok").length;
  const bad = Object.values(v).filter(x=>x.verdict==="wrong").length;
  const acc = (ok+bad) ? Math.round(ok/(ok+bad)*100) : 0;
  tally.innerHTML = `${n} charts · <b class="ok">${ok} ✓</b> · <b class="bad">${bad} ✗</b> · ${n-ok-bad} left · ${ok+bad?acc+"% correct":""}`;

  const list = document.getElementById("list");
  const rows = DATA.results.filter(r => {
    const vd = v[r.path]?.verdict;
    if (FILTER==="all") return true;
    if (FILTER==="unmarked") return !vd;
    return vd===FILTER;
  });
  // Paginate — render only PAGE_SIZE cards at a time (811 images at once
  // is what made the page crawl).
  const pages = Math.max(1, Math.ceil(rows.length / PAGE_SIZE));
  if (PAGE >= pages) PAGE = pages - 1;
  if (PAGE < 0) PAGE = 0;
  const pager = document.getElementById("pager");
  if (pager) pager.textContent = `page ${PAGE+1}/${pages} (${rows.length})`;
  if (!rows.length) { list.innerHTML = `<div class="empty">No charts in this filter.</div>`; return; }
  const pageRows = rows.slice(PAGE*PAGE_SIZE, PAGE*PAGE_SIZE + PAGE_SIZE);
  list.innerHTML = pageRows.map(r => {
    const vd = v[r.path]?.verdict;
    const notes = v[r.path]?.notes || "";
    const cor = v[r.path]?.correction || {};
    const ct = r.call_type || "—";
    const setupTxt = (r.setup_dirs && r.setup_dirs.length)
      ? `${r.n_setups} setup(s): ${r.setup_dirs.join(", ")}` : "no setups";
    return `<div class="row ${vd||''}" data-path="${r.path}">
      <div class="chartwrap"><img src="${API}${r.image_url}" loading="lazy"
           onclick="lightbox('${API}${r.image_url}')" /></div>
      <div class="meta">
        <div class="idx">#${r.i+1} · ${r.slug} · ${r.author||''}</div>
        <div class="caption ${r.caption?'':'empty'}">${r.caption ? "💬 "+r.caption.replace(/</g,'&lt;') : "(no caption text)"}</div>
        ${r.error ? `<div class="err">⚠ ${r.error}</div>` : `
          <div><span class="badge ct-${ct}">${ct}</span></div>
          <div class="kv"><span>ticker</span> <b>${r.ticker||'—'}</b>
              &nbsp; <span>asset</span> <b>${r.asset_class||'—'}</b></div>
          <div class="kv"><span>bias</span> <b>${r.bias||'—'}</b>
              &nbsp; <span>forward?</span> <b>${r.is_forward_looking}</b></div>
          <div class="setups">${setupTxt}</div>
        `}
        <div class="actions">
          <button class="ok ${vd==='ok'?'sel':''}" onclick="mark('${r.path}','ok')">✓ correct</button>
          <button class="bad ${vd==='wrong'?'sel':''}" onclick="mark('${r.path}','wrong')">✗ wrong</button>
        </div>
        <div class="correct">
          <div class="lbl">ground truth — fix anything the model got wrong</div>
          <div class="grid">
            <label>call_type
              <select class="c-call_type">${CT_OPTS.map(o=>`<option ${(cor.call_type??r.call_type)===o?'selected':''}>${o}</option>`).join("")}</select>
            </label>
            <label>direction
              <select class="c-direction">${DIR_OPTS.map(o=>`<option ${(cor.direction??(r.setup_dirs&&r.setup_dirs[0])??'')===o?'selected':''}>${o}</option>`).join("")}</select>
            </label>
            <label>ticker
              <input class="c-ticker" value="${cor.ticker??r.ticker??''}" />
            </label>
            <label>forward-looking?
              <select class="c-fwd">${["true","false"].map(o=>`<option ${String(cor.is_forward_looking??r.is_forward_looking)===o?'selected':''}>${o}</option>`).join("")}</select>
            </label>
            <label>final target
              <input class="c-target" value="${cor.final_target??''}" placeholder="e.g. 1750" />
            </label>
            <label>bias (current sentiment)
              <select class="c-bias">${BIAS_OPTS.map(o=>`<option ${(cor.bias??r.bias??'')===o?'selected':''}>${o}</option>`).join("")}</select>
            </label>
            <label>trade_stage
              <select class="c-stage">${STAGE_OPTS.map(o=>`<option ${(cor.trade_stage??r.trade_stage??'')===o?'selected':''}>${o}</option>`).join("")}</select>
            </label>
          </div>
          <textarea class="notes" placeholder="what's wrong / extra context…">${notes}</textarea>
          <button class="savebtn ${vd?'done':''}" onclick="saveCorrection('${r.path}')">
            ${vd?'✓ saved — update':'save ground truth'}
          </button>
        </div>
      </div>
    </div>`;
  }).join("");
}

document.querySelectorAll(".filterbtn[data-f]").forEach(b => b.onclick = () => {
  if (b.dataset.f==="refresh") { load(); return; }
  FILTER = b.dataset.f; PAGE = 0;
  document.querySelectorAll(".filterbtn[data-f]").forEach(x=>x.classList.toggle("on", x===b));
  render();
});
document.getElementById("prev").onclick = () => { PAGE--; render(); window.scrollTo(0,0); };
document.getElementById("next").onclick = () => { PAGE++; render(); window.scrollTo(0,0); };
load();
// (auto-refresh removed — data is static now; use the ↻ refresh button if needed)
</script>
</body>
</html>
